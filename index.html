<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Cyber Solution - Under Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #020617;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 50px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(6, 182, 212, 0.1);
      color: #67e8f9;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 58px;
      font-weight: bold;
      margin-bottom: 24px;
      line-height: 1.1;
    }

    p {
      font-size: 20px;
      color: #cbd5e1;
      max-width: 620px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .dots {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: #22d3ee;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #64748b;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.6;
      }
      40% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 38px;
      }

      p {
        font-size: 17px;
      }

      .container {
        padding: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">TECH CYBER SOLUTION</div>

    <h1>Website Under Construction</h1>

    <p>
      We’re building something secure, modern, and powerful.
      Our new digital experience is on the way.
    </p>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="footer">
      © 2026 Tech Cyber Solution. Launching soon.
    </div>
  </div>

</body>
</html>
